version: 2
seeds:
  - name: region_mapping
    description: >
      The 22 pre-2016 French regions used in freMTPL2, with their INSEE region codes and the
      2016 administrative region they were merged into (loi NOTRe).
    config:
      schema: reference
      column_types: {insee_code_pre2016: varchar, insee_code_2016: varchar}
    columns:
      - name: region_name
        data_tests: [unique, not_null]
      - name: insee_code_pre2016
        data_tests: [unique, not_null]
      - name: region_2016
        data_tests: [not_null]
