name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: make lint
      - name: Download freMTPL2
        run: make data
      - name: dbt build (DuckDB) - models and tests
        run: make dbt-build
      - name: Train pricing models
        run: make train
      - name: Price optimization (simulated demand)
        run: make optimize
      - name: dbt build on model outputs
        run: make dbt-post
      - name: pytest
        run: make test
      - name: dbt docs
        run: make docs

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - name: Build both images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d --wait
      - name: Smoke test (/health and one /quote through nginx)
        run: scripts/smoke_test.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down -v
        if: always()
